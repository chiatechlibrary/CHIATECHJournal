<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="704" viewBox="0 0 1100 704"><title>e043-04 · Detection value → Trade facilitation → Calibration &amp; robustness → Fairness &amp; due process → Operational resilience → Economic value</title><desc>Balance enforcement yield, facilitation, legality, robustness, fairness and total operating cost.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 281.75 34.9 526.5 36.6 L 528 180 Q 281.75 182.3 36 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 37 Q 818.25 34.9 1063 36.6 L 1064.5 180 Q 818.25 182.3 572.5 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 237 Q 281.75 234.9 526.5 236.6 L 528 380 Q 281.75 382.3 36 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 237 Q 818.25 234.9 1063 236.6 L 1064.5 380 Q 818.25 382.3 572.5 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 437 Q 281.75 434.9 526.5 436.6 L 528 580 Q 281.75 582.3 36 581 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 437 Q 818.25 434.9 1063 436.6 L 1064.5 580 Q 818.25 582.3 572.5 581 Z" fill="white" stroke="#242424" stroke-width="1.8"/><text x="281.75" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Detection value</text><text x="281.75" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Recall of confirmed IPR infringements;</text><text x="281.75" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">precision / positive predictive value; hit</text><text x="281.75" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">rate</text><text x="818.25" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Trade facilitation</text><text x="818.25" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Inspection and false-positive rates;</text><text x="818.25" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">clearance time; release of low-risk</text><text x="818.25" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">legitimate trade</text><text x="281.75" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Calibration &amp; robustness</text><text x="281.75" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Calibration error; performance by border,</text><text x="281.75" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">post, route and commodity; out-of-time</text><text x="281.75" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">stability</text><text x="818.25" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Fairness &amp; due process</text><text x="818.25" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Disparate-error checks; officer</text><text x="818.25" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">explanations; human override; contested and</text><text x="818.25" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">redress pathways</text><text x="281.75" y="485.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Operational resilience</text><text x="281.75" y="525.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Uptime, offline fallback, cybersecurity</text><text x="281.75" y="550.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">incidents and data-quality exceptions</text><text x="818.25" y="473" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Economic value</text><text x="818.25" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Cost per actionable hit; inspection-hours</text><text x="818.25" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">saved; avoided harm; maintenance and</text><text x="818.25" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">training costs</text><text x="36" y="665" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Balance enforcement yield, facilitation, legality, robustness, fairness and total operating</text><text x="36" y="689" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">cost.</text></svg>