<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="629" viewBox="0 0 1100 629"><title>e043-01 · 1 · Advance data → 2 · Risk analytics → 3 · GEOINT → 4 · NII / vision → 5 · Authentication → 6 · Officer decision</title><desc>Preserve provenance and human override across layers; technology supports lawful Customs judgment.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 281.75 34.9 526.5 36.6 L 528 155 Q 281.75 157.3 36 156 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 37 Q 818.25 34.9 1063 36.6 L 1064.5 155 Q 818.25 157.3 572.5 156 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 212 Q 281.75 209.9 526.5 211.6 L 528 330 Q 281.75 332.3 36 331 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 212 Q 818.25 209.9 1063 211.6 L 1064.5 330 Q 818.25 332.3 572.5 331 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 387 Q 281.75 384.9 526.5 386.6 L 528 505 Q 281.75 507.3 36 506 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 387 Q 818.25 384.9 1063 386.6 L 1064.5 505 Q 818.25 507.3 572.5 506 Z" fill="white" stroke="#242424" stroke-width="1.8"/><text x="281.75" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">1 · Advance data</text><text x="281.75" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Manifest/declaration; trader history; route,</text><text x="281.75" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">commodity and rights-holder alerts</text><text x="818.25" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">2 · Risk analytics</text><text x="818.25" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Rules, anomaly detection and machine</text><text x="818.25" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">learning; rank by inspection value</text><text x="281.75" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">3 · GEOINT</text><text x="281.75" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Hotspots, unofficial crossings, route</text><text x="281.75" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">deviation and patrol prioritization</text><text x="818.25" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">4 · NII / vision</text><text x="818.25" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Scanner images; object detection; packaging</text><text x="818.25" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">and quantity anomalies</text><text x="281.75" y="423" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">5 · Authentication</text><text x="281.75" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">IPM; barcode/QR and security features;</text><text x="281.75" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">rights-holder verification</text><text x="818.25" y="423" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">6 · Officer decision</text><text x="818.25" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Inspect, detain or release; document</text><text x="818.25" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">evidence; escalate legal action</text><text x="36" y="590" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Preserve provenance and human override across layers; technology supports lawful Customs</text><text x="36" y="614" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">judgment.</text></svg>