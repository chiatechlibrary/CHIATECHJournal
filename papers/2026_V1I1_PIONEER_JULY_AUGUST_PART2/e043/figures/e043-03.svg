<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="504" viewBox="0 0 1100 504"><title>e043-03 · Acquire image → Preprocess → Detect / classify → Fuse risk evidence → Officer adjudication → Learn &amp; monitor</title><desc>Nigerian deployment requires local scanner data, labelled outcomes and site-specific validation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 192.33333333333334 34.9 347.6666666666667 36.6 L 349.1666666666667 180 Q 192.33333333333334 182.3 36 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 37 Q 550 34.9 705.3333333333334 36.6 L 706.8333333333334 180 Q 550 182.3 393.6666666666667 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 37 Q 907.6666666666667 34.9 1063 36.6 L 1064.5 180 Q 907.6666666666667 182.3 751.3333333333334 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 237 Q 907.6666666666667 234.9 1063 236.6 L 1064.5 380 Q 907.6666666666667 382.3 751.3333333333334 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 237 Q 550 234.9 705.3333333333334 236.6 L 706.8333333333334 380 Q 550 382.3 393.6666666666667 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 237 Q 192.33333333333334 234.9 347.6666666666667 236.6 L 349.1666666666667 380 Q 192.33333333333334 382.3 36 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 353.6666666666667 108.5 Q 370.4666666666667 107.7 385.6666666666667 108.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 711.3333333333334 108.5 Q 728.1333333333333 107.7 743.3333333333334 108.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 907.6666666666667 186 Q 908.4666666666667 206.2 907.6666666666667 228" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 746.3333333333334 308.5 Q 731.1333333333333 307.7 714.3333333333334 308.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 388.6666666666667 308.5 Q 373.4666666666667 307.7 356.6666666666667 308.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><text x="192.33333333333334" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Acquire image</text><text x="192.33333333333334" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">X-ray/gamma-ray NII scan;</text><text x="192.33333333333334" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">quality and scanner metadata</text><text x="550" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Preprocess</text><text x="550" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Normalize, de-noise and</text><text x="550" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">align; remove known</text><text x="550" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">artefacts</text><text x="907.6666666666667" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Detect / classify</text><text x="907.6666666666667" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Objects, concealment cues</text><text x="907.6666666666667" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">and packaging/quantity</text><text x="907.6666666666667" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">anomalies</text><text x="907.6666666666667" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Fuse risk evidence</text><text x="907.6666666666667" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Declaration, trader, route,</text><text x="907.6666666666667" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">GEOINT and IP alerts</text><text x="550" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Officer adjudication</text><text x="550" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Review image and</text><text x="550" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">explanation; inspect,</text><text x="550" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">release or escalate</text><text x="192.33333333333334" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Learn &amp; monitor</text><text x="192.33333333333334" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Confirmed outcomes, false</text><text x="192.33333333333334" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">alarms, drift and retraining</text><text x="192.33333333333334" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">audit</text><text x="36" y="465" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Nigerian deployment requires local scanner data, labelled outcomes and site-specific</text><text x="36" y="489" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">validation.</text></svg>