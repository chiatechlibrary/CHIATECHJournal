<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><title>e043-02 · 8 days → 37 seizures → Integrated tools → IPR interpretation</title><desc>Source retained from manuscript: World Customs Organization, 17 July 2026.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 281.75 34.9 526.5 36.6 L 528 230 Q 281.75 232.3 36 231 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 37 Q 818.25 34.9 1063 36.6 L 1064.5 230 Q 818.25 232.3 572.5 231 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 287 Q 281.75 284.9 526.5 286.6 L 528 480 Q 281.75 482.3 36 481 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 287 Q 818.25 284.9 1063 286.6 L 1064.5 480 Q 818.25 482.3 572.5 481 Z" fill="white" stroke="#242424" stroke-width="1.8"/><text x="281.75" y="110.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">8 days</text><text x="281.75" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Joint WCO-led operational deployment along</text><text x="281.75" y="175.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">the Benin–Nigeria border corridor</text><text x="818.25" y="110.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">37 seizures</text><text x="818.25" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Narcotics, pharmaceuticals, petroleum</text><text x="818.25" y="175.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">products and consumer goods</text><text x="281.75" y="360.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Integrated tools</text><text x="281.75" y="400.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">GEOINT/GIS, drones, WCO Geoportal, CENcomm,</text><text x="281.75" y="425.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">risk profiling and field intelligence</text><text x="818.25" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">IPR interpretation</text><text x="818.25" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Hotspot identification and coordinated</text><text x="818.25" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">targeting demonstrated; IPR effectiveness</text><text x="818.25" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">still needs authentication data,</text><text x="818.25" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">rights-holder collaboration and</text><text x="818.25" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">offence-specific validation.</text><text x="36" y="565" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Source retained from manuscript: World Customs Organization, 17 July 2026.</text></svg>