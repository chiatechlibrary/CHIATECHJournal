ont-size="21" fill="#252525">star performance</text><text x="550" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">e050 outputs</text><text x="550" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">kWh/m²·year, MWh/year and</text><text x="550" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">robust stress scenarios</text><text x="36" y="465" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">The crosswalk updates published evidence with efficiency thresholds; it does not claim new</text><text x="36" y="489" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">field measurements.</text></svg>