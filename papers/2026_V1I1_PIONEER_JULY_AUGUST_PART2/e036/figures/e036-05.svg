="1.7" marker-end="url(#arrow)"/><path d="M 907.6666666666667 161 Q 908.4666666666667 181.2 907.6666666666667 203" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 746.3333333333334 271 Q 731.1333333333333 270.2 714.3333333333334 271" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 388.6666666666667 271 Q 373.4666666666667 270.2 356.6666666666667 271" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><text x="192.33333333333334" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 0 · Memory / cash</text><text x="192.33333333333334" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">No durable accounting trail</text><text x="550" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 1 · Basic records</text><text x="550" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Sales, costs, debtors and</text><text x="550" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">stock</text><text x="907.6666666666667" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 2 · Control</text><text x="907.6666666666667" y="99" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">discipline</text><text x="907.6666666666667" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Separate funds and reconcile</text><text x="907.6666666666667" y="234.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 3 · Digital</text><text x="907.6666666666667" y="261.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">accounting</text><text x="907.6666666666667" y="301.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Applications, APIs and</text><text x="907.6666666666667" y="326.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">payment feeds</text><text x="550" y="234.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 4 · Accounting</text><text x="550" y="261.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">analytics</text><text x="550" y="301.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Margins, cash flow and</text><text x="550" y="326.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">alerts</text><text x="192.33333333333334" y="234.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Level 5 · Governed data</text><text x="192.33333333333334" y="261.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">science</text><text x="192.33333333333334" y="301.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Validated models, privacy</text><text x="192.33333333333334" y="326.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">and auditability</text><text x="36" y="415" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Capability-based progression: software does not substitute for record quality,</text><text x="36" y="439" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">reconciliation or accountable review.</text></svg>