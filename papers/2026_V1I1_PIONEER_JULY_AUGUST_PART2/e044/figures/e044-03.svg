<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="504" viewBox="0 0 1100 504"><title>e044-03 · Tier 0 · No-break → Tier 1 · Mission-essential → Tier 2 · Essential support → Tier 3 · Deferrable</title><desc>During supply stress, shed Tier 3 first; preserve Tier 0 continuously unless equipment safety requires isolation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 281.75 34.9 526.5 36.6 L 528 180 Q 281.75 182.3 36 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 37 Q 818.25 34.9 1063 36.6 L 1064.5 180 Q 818.25 182.3 572.5 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 237 Q 281.75 234.9 526.5 236.6 L 528 380 Q 281.75 382.3 36 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 237 Q 818.25 234.9 1063 236.6 L 1064.5 380 Q 818.25 382.3 572.5 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><text x="281.75" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Tier 0 · No-break</text><text x="281.75" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Life-safety and command: command post,</text><text x="281.75" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">radios, core network, security systems and</text><text x="281.75" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">emergency lighting</text><text x="818.25" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Tier 1 · Mission-essential</text><text x="818.25" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">ICT rooms, border-control workstations,</text><text x="818.25" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">selected inspection technology and access</text><text x="818.25" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">control</text><text x="281.75" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Tier 2 · Essential support</text><text x="281.75" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Barracks lighting, water pumping,</text><text x="281.75" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">refrigeration and operational workshops</text><text x="818.25" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Tier 3 · Deferrable</text><text x="818.25" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Non-critical air conditioning, discretionary</text><text x="818.25" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">sockets and nonessential services</text><text x="36" y="465" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">During supply stress, shed Tier 3 first; preserve Tier 0 continuously unless equipment</text><text x="36" y="489" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">safety requires isolation.</text></svg>