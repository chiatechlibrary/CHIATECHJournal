<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="504" viewBox="0 0 1100 504"><title>e044-05 · Normal → Grid event → Extended outage → Recovery</title><desc>Use surplus PV for load and charging before curtailment. Start generation before storage reserve is exhausted; maintain black-start capability.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 192.33333333333334 34.9 347.6666666666667 36.6 L 349.1666666666667 180 Q 192.33333333333334 182.3 36 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 37 Q 550 34.9 705.3333333333334 36.6 L 706.8333333333334 180 Q 550 182.3 393.6666666666667 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 37 Q 907.6666666666667 34.9 1063 36.6 L 1064.5 180 Q 907.6666666666667 182.3 751.3333333333334 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 237 Q 907.6666666666667 234.9 1063 236.6 L 1064.5 380 Q 907.6666666666667 382.3 751.3333333333334 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 353.6666666666667 108.5 Q 370.4666666666667 107.7 385.6666666666667 108.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 711.3333333333334 108.5 Q 728.1333333333333 107.7 743.3333333333334 108.5" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 907.6666666666667 186 Q 908.4666666666667 206.2 907.6666666666667 228" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><text x="192.33333333333334" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Normal</text><text x="192.33333333333334" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Grid and PV supply loads; PV</text><text x="192.33333333333334" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">charges BESS</text><text x="550" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Grid event</text><text x="550" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">BESS assumes critical bus</text><text x="550" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">within milliseconds /</text><text x="550" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">seconds</text><text x="907.6666666666667" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Extended outage</text><text x="907.6666666666667" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Start generator after delay;</text><text x="907.6666666666667" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">run near efficient loading</text><text x="907.6666666666667" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Recovery</text><text x="907.6666666666667" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Stabilize grid, recharge</text><text x="907.6666666666667" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">BESS and stop generator</text><text x="907.6666666666667" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">after cooldown</text><text x="36" y="465" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Use surplus PV for load and charging before curtailment. Start generation before storage</text><text x="36" y="489" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">reserve is exhausted; maintain black-start capability.</text></svg>