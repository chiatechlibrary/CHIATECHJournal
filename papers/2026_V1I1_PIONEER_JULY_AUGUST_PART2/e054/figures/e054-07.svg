ll="#252525">Electrolytes similar;</text><text x="192.33333333333334" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">proteins lower</text><text x="550" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Interpret</text><text x="550" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Fit with the archived study;</text><text x="550" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">subtle renal disease is not</text><text x="550" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">excluded</text><text x="907.6666666666667" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Modern context</text><text x="907.6666666666667" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Pre-eclampsia is multisystem</text><text x="907.6666666666667" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">disease; creatinine alone is</text><text x="907.6666666666667" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">insufficient</text><text x="907.6666666666667" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Apply</text><text x="907.6666666666667" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Add urine PCR/ACR and</text><text x="907.6666666666667" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">organ-function assessment</text><text x="36" y="465" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Source: n = 149, five gestational/BP groups and nine serum assays. Contemporary</text><text x="36" y="489" font-family="Georgia,serif" font-size=