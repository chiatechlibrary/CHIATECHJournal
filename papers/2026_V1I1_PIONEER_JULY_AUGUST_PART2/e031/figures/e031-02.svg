<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="704" viewBox="0 0 1100 704"><title>e031-02 · Foundations → Lab governance → Defensive engineering → Authorized emulation → Specialized domains → Detect &amp; respond → Governance &amp; automation</title><desc>Each layer produces auditable evidence, including risk registers, hardening records, logs, rules of engagement and remediation plans.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 192.33333333333334 34.9 347.6666666666667 36.6 L 349.1666666666667 180 Q 192.33333333333334 182.3 36 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 37 Q 550 34.9 705.3333333333334 36.6 L 706.8333333333334 180 Q 550 182.3 393.6666666666667 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 37 Q 907.6666666666667 34.9 1063 36.6 L 1064.5 180 Q 907.6666666666667 182.3 751.3333333333334 181 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 237 Q 907.6666666666667 234.9 1063 236.6 L 1064.5 380 Q 907.6666666666667 382.3 751.3333333333334 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 237 Q 550 234.9 705.3333333333334 236.6 L 706.8333333333334 380 Q 550 382.3 393.6666666666667 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 237 Q 192.33333333333334 234.9 347.6666666666667 236.6 L 349.1666666666667 380 Q 192.33333333333334 382.3 36 381 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 437 Q 192.33333333333334 434.9 347.6666666666667 436.6 L 349.1666666666667 580 Q 192.33333333333334 582.3 36 581 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 353.6666666666667 108.5 Q 370.4666666666667 107.7 385.6666666666667 108.5" fill="none" stroke