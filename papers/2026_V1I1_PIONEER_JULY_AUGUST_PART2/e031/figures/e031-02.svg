ening, identity,</text><text x="907.6666666666667" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">segmentation and logging</text><text x="907.6666666666667" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Authorized emulation</text><text x="907.6666666666667" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Reconnaissance, validation</text><text x="907.6666666666667" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">and attack-path reasoning</text><text x="550" y="285.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Specialized domains</text><text x="550" y="325.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Web, cloud, mobile, IoT and</text><text x="550" y="350.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">OT</text><text x="192.33333333333334" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Detect &amp; respond</text><text x="192.33333333333334" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Threat hunting, evidence,</text><text x="192.33333333333334" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">incident timeline and</text><text x="192.33333333333334" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">response</text><text x="192.33333333333334" y="473" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Governance &amp; automation</text><text x="192.33333333333334" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">DevSecOps, zero trust,</text><text x="192.33333333333334" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">supply chain and workforce</text><text x="192.33333333333334" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">mapping</text><text x="36" y="665" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Each layer produces auditable evidence, including risk registers, hardening records, logs,</text><text x="36" y="689" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">rules of engagement and remediation plans.</text></svg>