<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="554" viewBox="0 0 1100 554"><title>e040-05 · Economic / technology barrier → Infrastructure barrier → Capability barrier</title><desc>Adoption requires coordinated responses to cost, electricity and skills; training alone cannot remove affordability or infrastructure constraints.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 281.75 34.9 526.5 36.6 L 528 205 Q 281.75 207.3 36 206 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 573.5 37 Q 818.25 34.9 1063 36.6 L 1064.5 205 Q 818.25 207.3 572.5 206 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 37 262 Q 281.75 259.9 526.5 261.6 L 528 430 Q 281.75 432.3 36 431 Z" fill="white" stroke="#242424" stroke-width="1.8"/><text x="281.75" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Economic / technology barrier</text><text x="281.75" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Hardware and software cost: 82.5%.</text><text x="281.75" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Responses: shared digital-fashion hubs,</text><text x="281.75" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">low-cost/open tools and cooperative</text><text x="281.75" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">procurement.</text><text x="818.25" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Infrastructure barrier</text><text x="818.25" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Unreliable electricity: 76.0%. Responses:</text><text x="818.25" y="150.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">solar/inverter-backed hubs, offline-capable</text><text x="818.25" y="175.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">workflows and scheduled lab access.</text><text x="281.75" y="298" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Capability barrier</text><text x="281.75" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Insufficient technical training: 64.3%.</text><text x="281.75" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Responses: hands-on CAD training,</text><text x="281.75" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">apprenticeship integration and peer</text><text x="281.75" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">mentoring.</text><text x="36" y="515" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">Adoption requires coordinated responses to cost, electricity and skills; training alone</text><text x="36" y="539" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">cannot remove affordability or infrastructure constraints.</text></svg>