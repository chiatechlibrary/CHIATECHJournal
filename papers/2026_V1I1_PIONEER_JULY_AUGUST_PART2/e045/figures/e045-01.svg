<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="454" viewBox="0 0 1100 454"><title>e045-01 · Prior Dota evidence → Calibrated 24-hour archetype → Constrained load shifting → Performance → Implementation</title><desc>The hourly curve is a transparent calibrated reconstruction, not newly measured smart-meter data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 1 L7 4 L0 7" fill="none" stroke="#303030" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="white"/><path d="M 37 37 Q 192.33333333333334 34.9 347.6666666666667 36.6 L 349.1666666666667 155 Q 192.33333333333334 157.3 36 156 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 37 Q 550 34.9 705.3333333333334 36.6 L 706.8333333333334 155 Q 550 157.3 393.6666666666667 156 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 37 Q 907.6666666666667 34.9 1063 36.6 L 1064.5 155 Q 907.6666666666667 157.3 751.3333333333334 156 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 752.3333333333334 212 Q 907.6666666666667 209.9 1063 211.6 L 1064.5 330 Q 907.6666666666667 332.3 751.3333333333334 331 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 394.6666666666667 212 Q 550 209.9 705.3333333333334 211.6 L 706.8333333333334 330 Q 550 332.3 393.6666666666667 331 Z" fill="white" stroke="#242424" stroke-width="1.8"/><path d="M 353.6666666666667 96 Q 370.4666666666667 95.2 385.6666666666667 96" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 711.3333333333334 96 Q 728.1333333333333 95.2 743.3333333333334 96" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 907.6666666666667 161 Q 908.4666666666667 181.2 907.6666666666667 203" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M 746.3333333333334 271 Q 731.1333333333333 270.2 714.3333333333334 271" fill="none" stroke="#303030" stroke-width="1.7" marker-end="url(#arrow)"/><text x="192.33333333333334" y="85.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Prior Dota evidence</text><text x="192.33333333333334" y="125.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">59.61 kWh/day; 9.62 kW peak</text><text x="550" y="59.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Calibrated 24-hour</text><text x="550" y="86.5" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">archetype</text><text x="550" y="126.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Residential profile; energy</text><text x="550" y="151.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">and peak preserved</text><text x="907.6666666666667" y="73" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Constrained load shifting</text><text x="907.6666666666667" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Flexible share: 10–40%;</text><text x="907.6666666666667" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">shifting window: ±w</text><text x="907.6666666666667" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Performance</text><text x="907.6666666666667" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Peak, PAR, load factor and</text><text x="907.6666666666667" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">normalized cost index</text><text x="550" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Implementation</text><text x="550" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Metering, HEMS and mini-grid</text><text x="550" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">control</text><text x="36" y="415" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">The hourly curve is a transparent calibrated reconstruction, not newly measured smart-meter</text><text x="36" y="439" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">data.</text></svg>