 fill="#252525">Design equations;</text><text x="192.33333333333334" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">MATLAB/Simulink, Proteus,</text><text x="192.33333333333334" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">breadboard and Vero board</text><text x="550" y="98" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Parameter audit</text><text x="550" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">24 V to 19 V; 3.5 A; 30 kHz;</text><text x="550" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">L = 251 µH; C = 15 µF; Type</text><text x="550" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">III</text><text x="907.6666666666667" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">2026 analytical</text><text x="907.6666666666667" y="99" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">reconstruction</text><text x="907.6666666666667" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">Clean schematics and</text><text x="907.6666666666667" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">equations; ripple</text><text x="907.6666666666667" y="189" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">calculations; small-signal</text><text x="907.6666666666667" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">loop model</text><text x="907.6666666666667" y="323" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#151515">Publication boundary</text><text x="907.6666666666667" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">No invented oscilloscope</text><text x="907.6666666666667" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">scales or new bench</text><text x="907.6666666666667" y="413" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">precision; analytical and</text><text x="907.6666666666667" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">measured evidence</text><text x="907.6666666666667" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#252525">distinguished</text><text x="36" y="565" font-family="Georgia,serif" font-size="20" font-style="italic" fill="#333">The historical engineering record remains distinct from the 2026 analytical reconstruction.</text></svg>